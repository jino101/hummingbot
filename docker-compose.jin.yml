services:
  jin-paper:
    build:
      context: .
      dockerfile: Dockerfile.jin
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      JIN_DASHBOARD_TOKEN: ${JIN_DASHBOARD_TOKEN:?Set JIN_DASHBOARD_TOKEN}
    volumes:
      - jin-paper-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  jin-paper-data:
