name: Jino Android

on:
  push:
    branches: [chatgpt/arbitrage-bot]
    paths:
      - 'jino_android/**'
      - '.github/workflows/jino_android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'jino_android/**'
      - '.github/workflows/jino_android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p jino_android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jino-android-debug
          path: jino_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
