name: Jino Arbitrage CI

on:
  push:
    branches: [chatgpt/arbitrage-bot]
  pull_request:
    branches: [master]
    paths:
      - 'controllers/generic/jino_cross_exchange_arbitrage.py'
      - 'hummingbot/jino_arbitrage/**'
      - 'hummingbot/cli/strategy_configs.py'
      - 'test/controllers/generic/test_jino_cross_exchange_arbitrage.py'
      - 'test/hummingbot/jino_arbitrage/**'
      - 'test/hummingbot/data_feed/test_market_data_provider.py'
      - 'test/hummingbot/cli/test_strategy_configs.py'
      - 'test/hummingbot/strategy/test_jino_strategy_v2_loader.py             test/hummingbot/strategy_v2/executors/arbitrage_executor/test_arbitrage_executor.py'
      - 'test/hummingbot/strategy_v2/executors/arbitrage_executor/test_arbitrage_executor.py'
      - 'scripts/jino_arbitrage_paper_smoke.sh'
      - 'scripts/jino_arbitrage_paper_soak.sh'
      - 'scripts/jino_arbitrage_paper_execution.sh'
      - 'scripts/jino_arbitrage_paper_validate.sh'
      - '.github/workflows/jino_arbitrage_ci.yml'
  workflow_dispatch:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache conda dependencies
        id: conda-dependencies
        uses: actions/cache@v5
        with:
          path: |
            /home/runner/conda_pkgs_dir/
            /usr/share/miniconda/envs
          key: ${{ runner.os }}-jino-conda-${{ hashFiles('setup/environment.yml') }}
      - name: Install Hummingbot environment
        uses: ./.github/actions/install_env_and_hb
        with:
          program-cache-hit: 'false'
          dependencies-cache-hit: ${{ steps.conda-dependencies.outputs.cache-hit }}
      - name: Check Jino shell helpers
        shell: bash
        run: |
          bash -n scripts/jino_arbitrage_paper_smoke.sh
          bash -n scripts/jino_arbitrage_paper_soak.sh
          bash -n scripts/jino_arbitrage_paper_execution.sh
          bash -n scripts/jino_arbitrage_paper_validate.sh
      - name: Run Jino arbitrage tests
        shell: bash
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate hummingbot
          PYTHONPATH=$GITHUB_WORKSPACE pytest -q             test/controllers/generic/test_jino_cross_exchange_arbitrage.py             test/hummingbot/jino_arbitrage             test/hummingbot/data_feed/test_market_data_provider.py             test/hummingbot/cli/test_strategy_configs.py             test/hummingbot/strategy/test_jino_strategy_v2_loader.py
