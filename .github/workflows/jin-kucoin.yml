name: JIN KuCoin integration
on:
  push:
    paths: ['jin_trading/**', 'tests_jin/**', 'scripts/jin_public_probe.py', 'scripts/jin_paper_soak.py', '.github/workflows/jin-kucoin.yml']
  pull_request:
    paths: ['jin_trading/**', 'tests_jin/**', 'scripts/jin_public_probe.py', 'scripts/jin_paper_soak.py', '.github/workflows/jin-kucoin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r jin_trading/requirements-live.txt pandas==2.2.3
      - run: python -m unittest discover -s tests_jin
      - run: python -m compileall -q jin_trading scripts/jin_public_probe.py scripts/jin_paper_soak.py
  public-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r jin_trading/requirements-live.txt
      - name: Observe three public KuCoin books; no credentials or orders
        run: python scripts/jin_public_probe.py --seconds 30 --require-fresh > kucoin-public-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kucoin-public-probe
          path: kucoin-public-probe.json
