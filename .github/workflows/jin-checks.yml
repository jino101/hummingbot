name: JIN paper trading checks
on:
  push:
    paths: ['jin_trading/**', 'tests_jin/**', 'scripts/jin_arbitrage_monitor.py', 'hummingbot/strategy_v2/executors/arbitrage_executor/**', 'controllers/generic/arbitrage_controller.py', 'controllers/generic/jino_cross_exchange_arbitrage.py', 'hummingbot/jino_arbitrage/**', 'jino_mobile/**', 'Dockerfile.jin', 'docker-compose.jin.yml', '.github/workflows/jin-checks.yml']
  pull_request:
    paths: ['jin_trading/**', 'tests_jin/**', 'scripts/jin_arbitrage_monitor.py', 'hummingbot/strategy_v2/executors/arbitrage_executor/**', 'controllers/generic/arbitrage_controller.py', 'controllers/generic/jino_cross_exchange_arbitrage.py', 'hummingbot/jino_arbitrage/**', 'jino_mobile/**', 'Dockerfile.jin', 'docker-compose.jin.yml', '.github/workflows/jin-checks.yml']
permissions:
  contents: read
jobs:
  paper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.16.2 pytest==9.1.1 pytest-asyncio==1.4.0 pytest-timeout==2.4.0 pandas==2.2.3
      - run: python -m compileall -q jin_trading scripts/jin_arbitrage_monitor.py controllers/generic/arbitrage_controller.py hummingbot/strategy_v2/executors/arbitrage_executor/arbitrage_executor.py
      - run: python -m coverage run --rcfile=/dev/null --branch --source=jin_trading -m unittest discover -s tests_jin
      - run: python -m coverage report --rcfile=/dev/null --fail-under=80
      - run: python -m pytest -q test/hummingbot/jino_arbitrage/test_opportunity.py test/hummingbot/jino_arbitrage/test_scanner.py test/hummingbot/jino_arbitrage/test_live_checks.py test/hummingbot/jino_arbitrage/test_recovery.py test/hummingbot/jino_arbitrage/test_observation_store.py test/jino_mobile/test_server.py
      - name: Validate JIN Docker deployment
        env:
          JIN_DASHBOARD_TOKEN: ci-only-not-a-real-secret-1234567890
        run: |
          docker build -f Dockerfile.jin -t jin-paper-ci .
          docker compose -f docker-compose.jin.yml config >/dev/null
